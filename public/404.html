<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwizy - Erreur 404</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Variables pour le mode clair (par défaut ici) et sombre */
        :root {
            --bg: #ffffff;
            --text: #111111;
            --border: #eaeaea;
            --hover-bg: #f5f5f5;
            --glow-opacity: 0.12;
            --gradient: linear-gradient(135deg, #a855f7, #3b82f6);
            --secondary: #0070FF;
        }

        .dark {
            --bg: #050505;
            --text: #f5f5f5;
            --border: #222222;
            --hover-bg: #111111;
            --glow-opacity: 0.25;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow: hidden;
            position: relative;
        }

        /* Halo lumineux Violet/Bleu minimaliste en arrière-plan */
        .glow-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw;
            height: 50vw;
            max-width: 500px;
            max-height: 500px;
            background: var(--gradient);
            filter: blur(100px);
            opacity: var(--glow-opacity);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
        }

        /* Texte minimaliste */
        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: -0.03em;
            margin-bottom: 2.5rem;
            line-height: 1.3;
        }

        /* Touche de couleur discrète sur un mot */
        .accent {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 500;
        }

        /* Bouton forme pilule ultra-épuré */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.75rem 1.5rem;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 9999px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--hover-bg);
            border-color: #3b82f6;
            transform: translateY(-1px);
        }

        .btn i {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .btn:hover i {
            transform: translateX(4px);
            color: #a855f7;
        }

        /* ---- TOPBAR ---- */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 1.5rem 2rem;
            z-index: 1000;
        }

        .topbar-logo {
            grid-column: 2;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            text-align: center;
        }

        .topbar-right {
            grid-column: 3;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .back-btn {
            width: 38px; height: 38px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background: var(--hover-bg);
            border-color: var(--secondary);
            color: var(--secondary);
            transform: translateX(-4px);
        }

        .theme-toggle-btn {
            width: 38px; height: 38px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            transition: all 0.25s ease;
        }

        .theme-toggle-btn:hover { background: var(--hover-bg); }
        .dark .theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.08); }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-left">
            <a href="/" class="back-btn" aria-label="Retour à l'accueil">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>
        <a href="/" class="topbar-logo">Kwizy</a>
        <div class="topbar-right">
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Changer de thème">
                <i id="theme-icon" class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Halo lumineux en fond -->
    <div class="glow-orb"></div>

    <main class="container">
        <!-- Phrase fun avec touche de couleur -->
        <h1>Oups, cette page a <span class="accent">séché les cours</span>.</h1>

        <!-- Bouton de retour -->
        <a href="/" class="btn">
            <span>Retrouver son chemin</span>
            <i data-lucide="arrow-right"></i>
        </a>
    </main>

    <script>
        lucide.createIcons();

        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        function applyTheme(t) {
            if (t === 'dark') {
                htmlElement.classList.add('dark');
                themeIcon.className = 'fas fa-sun';
            } else {
                htmlElement.classList.remove('dark');
                themeIcon.className = 'fas fa-moon';
            }
            localStorage.setItem('kwizy-theme', t);
        }

        const saved = localStorage.getItem('kwizy-theme');
        if (saved) {
            applyTheme(saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }

        toggleBtn.addEventListener('click', () => {
            applyTheme(htmlElement.classList.contains('dark') ? 'light' : 'dark');
        });
    </script>
</body>

</html>
