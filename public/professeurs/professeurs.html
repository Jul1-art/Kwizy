    `;
        document.head.appendChild(style);
      },

      escapeHtml: function (value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },

      escapeJsString: function (value) {
        return String(value ?? '')
          .replace(/\\/g, '\\\\')
          .replace(/'/g, "\\'")
          .replace(/\n/g, '\\n')
          .replace(/\r/g, '');
      },

      getState: function () { return window.state || {}; },

      getQuizzes: function () {
        const quizzes = Array.isArray(this.getState().quizzes) ? this.getState().quizzes : [];
        return quizzes.filter(q => q && q.status !== 'Trash');
      },

      getPublishedQuizzes: function () { return this.getQuizzes().filter(q => q.shareCode); },

      getQuizByCode: function (quizCode) {
        return this.getQuizzes().find(q => String(q.shareCode || '') === String(quizCode || '')) || null;
      },

      formatDate: function (value, fallback) {
        if (!value) return fallback || 'Date inconnue';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
      },

      formatDateTime: function (value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      },

      getTime: function (value) {
        const time = new Date(value || '').getTime();
        return Number.isNaN(time) ? 0 : time;
      },

      normalizeReport: function (item, fallbackQuiz) {
        const quiz = fallbackQuiz || this.getQuizByCode(item.quizCode || item.code || item.shareCode);
        const total = Number(item.total || 0);
        const points = Number(item.points ?? item.score ?? 0);
        const rawPercent = item.percentage ?? item.scorePercent ?? item.percent;
        const percent = rawPercent !== undefined
          ? Math.round(Number(rawPercent) || 0)
          : total > 0 ? Math.round((points / total) * 100) : Math.round(Number(item.score || 0) || 0);
        const rawDate = item.rawDate || item.submittedAt || item.date || '';
        return {
          student: String(item.student || item.name || 'Élève inconnu'),
          className: String(item.className || item.class || 'Sans classe'),
          quiz: String(item.quiz || item.quizTitle || quiz?.title || 'Quiz sans titre'),
          quizCode: String(item.quizCode || item.code || item.shareCode || quiz?.shareCode || ''),
          studentId: String(item.studentId || item.id || item.email || item.name || ''),
          date: item.date || this.formatDateTime(rawDate),
          rawDate, points, total,
          score: Math.max(0, Math.min(100, percent)),
          answers: Array.isArray(item.answers) ? item.answers : []
        };
      },

      getReports: function () {
        const reports = Array.isArray(this.getState().reports) ? this.getState().reports : [];
        return reports.map(r => this.normalizeReport(r)).sort((a, b) => this.getTime(b.rawDate || b.date) - this.getTime(a.rawDate || a.date));
      },

      getCurrentReports: function () {
        if (!this.currentQuizCode) return this.getReports();
        if (Array.isArray(this.currentResults) && this.currentResults.length) {
          const quiz = this.currentQuiz || this.getQuizByCode(this.currentQuizCode);
          return this.currentResults
            .map(r => this.normalizeReport({ ...r, quizCode: this.currentQuizCode }, quiz))
            .sort((a, b) => this.getTime(b.rawDate || b.date) - this.getTime(a.rawDate || a.date));
        }
        return this.getReports().filter(r => r.quizCode === this.currentQuizCode);
      },

      getScoreClass: function (score) {
        if (score >= 70) return 'good';
        if (score >= 50) return 'mid';
        return 'low';
      },

      renderScore: function (score) {
        return `<span class="rpt-score ${this.getScoreClass(score)}">${this.escapeHtml(score)}%</span>`;
      },

      average: function (items, selector) {
        if (!items.length) return 0;
        return Math.round(items.reduce((sum, item) => sum + selector(item), 0) / items.length);
      },

      getQuizCards: function () {
        const reports = this.getReports();
        return this.getPublishedQuizzes().map(quiz => {
          const quizReports = reports.filter(r => r.quizCode === String(quiz.shareCode));
          const classMap = new Map();
          quizReports.forEach(r => {
            if (!classMap.has(r.className)) classMap.set(r.className, []);
            classMap.get(r.className).push(r);
          });
          const classStats = [...classMap.entries()].map(([className, rows]) => ({
            className, average: this.average(rows, r => r.score), count: rows.length
          })).sort((a, b) => a.className.localeCompare(b.className));
          const latest = quizReports.reduce((max, r) => Math.max(max, this.getTime(r.rawDate || r.date)), 0);
          const quizDate = quiz.createdAt || quiz.updatedAt || quiz.date || latest || '';
          return {
            quiz, code: String(quiz.shareCode), title: quiz.title || 'Quiz sans titre',
            date: this.formatDate(quizDate, 'Date inconnue'),
            latestDate: latest ? this.formatDateTime(latest) : '',
            reports: quizReports, count: quizReports.length,
            average: this.average(quizReports, r => r.score), classStats,
            attention: quizReports.filter(r => r.score < 50).length,
            questionCount: Array.isArray(quiz.questions) ? quiz.questions.length : 0
          };
        }).sort((a, b) => this.getTime(b.quiz.createdAt || b.quiz.updatedAt || b.latestDate) - this.getTime(a.quiz.createdAt || a.quiz.updatedAt || a.latestDate));
      },

      getQuizStats: function (reports) {
        const classes = new Set(reports.map(r => r.className).filter(Boolean));
        return {
          copies: reports.length, average: this.average(reports, r => r.score),
          classes: classes.size, attention: reports.filter(r => r.score < 50).length,
          totalPoints: reports.reduce((sum, r) => sum + Number(r.points || 0), 0),
          totalMax: reports.reduce((sum, r) => sum + Number(r.total || 0), 0)
        };
      },

      getClasses: function (reports) {
        return [...new Set(reports.map(r => r.className).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      },

      getFilteredStudents: function (reports) {
        const q = String(this.quizFilters.query || '').trim().toLowerCase();
        let rows = reports.filter(r => {
          if (this.quizFilters.className !== 'all' && r.className !== this.quizFilters.className) return false;
          if (!q) return true;
          return `${r.student} ${r.className}`.toLowerCase().includes(q);
        });
        rows = rows.slice();
        if (this.quizFilters.sort === 'name') rows.sort((a, b) => a.student.localeCompare(b.student));
        if (this.quizFilters.sort === 'class') rows.sort((a, b) => a.className.localeCompare(b.className) || a.student.localeCompare(b.student));
        if (this.quizFilters.sort === 'scoreAsc') rows.sort((a, b) => a.score - b.score);
        if (this.quizFilters.sort === 'scoreDesc') rows.sort((a, b) => b.score - a.score);
        if (this.quizFilters.sort === 'recent') rows.sort((a, b) => this.getTime(b.rawDate || b.date) - this.getTime(a.rawDate || a.date));
        return rows;
      },

      getSelectedStudent: function (students) {
        if (!students.length) return null;
        const selected = students.find(r => String(r.studentId) === String(this.selectedStudentId));
        return selected || students[0];
      },

      getQuestionStats: function (reports, quiz) {
        const questions = Array.isArray(quiz.questions) ? quiz.questions : [];
        if (!questions.length || !reports.some(r => r.answers && r.answers.length)) return [];
        return questions.map((question, index) => {
          let answered = 0, correct = 0;
          reports.forEach(report => {
            const answer = report.answers && report.answers[index];
            if (!answer) return;
            answered += 1;
            if (answer.correct === true) correct += 1;
          });
          return { index, text: question.text || `Question ${index + 1}`, answered, correct, successRate: answered ? Math.round((correct / answered) * 100) : 0 };
        });
      },

      render: function (t) {
        this.injectStyles();
        if (this.currentQuizCode) return this.renderQuizPage(t);
        return this.renderHome(t);
      },

      renderHome: function (t) {
        const cards = this.getQuizCards();
        const query = String(this.homeQuery || '').trim().toLowerCase();
        const visibleCards = cards.filter(card => {
          if (!query) return true;
          return `${card.title} ${card.code} ${card.classStats.map(c => c.className).join(' ')}`.toLowerCase().includes(query);
        });
        return `
          <div class="w-full h-full fade-in flex gap-6 mob-full-col mob-auto-h">
            <div class="flex-1 flex flex-col gap-4 overflow-hidden">
              <div class="flex items-center gap-3 bg-white dark:bg-[#131313] border border-zinc-100 dark:border-white/10 rounded-2xl p-4 shadow-sm shrink-0 flex-wrap">
                <div class="flex items-center gap-2 shrink-0">
                  <h1 class="text-xl md:text-2xl font-black font-display text-zinc-900 dark:text-white">Choisir un quiz</h1>
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-secondary/10 text-secondary">Rapports élèves</span>
                </div>
                <div class="relative flex-1 md:max-w-lg md:ml-auto">
                  <i data-lucide="search" size="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"></i>
                  <input type="search" placeholder="Rechercher un quiz ou une classe..." value="${this.escapeHtml(this.homeQuery)}" oninput="ReportsDashboard.setHomeQuery(this.value)" class="w-full bg-zinc-50 dark:bg-[#1C1C1C] border border-zinc-200 dark:border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-secondary transition-colors text-zinc-900 dark:text-white">
                </div>
              </div>
              <div class="flex-1 bg-white dark:bg-[#131313] border border-zinc-100 dark:border-white/10 rounded-2xl overflow-y-auto shadow-sm p-4 md:p-6 relative">
                ${visibleCards.length ? `
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${visibleCards.map(card => this.renderQuizCard(card)).join('')}
                  </div>
                ` : this.renderEmpty(cards.length ? 'Aucun quiz trouvé' : 'Aucun quiz publié', cards.length ? 'Essayez une autre recherche.' : 'Publiez un quiz pour commencer à recevoir des rapports.')}
              </div>
            </div>
          </div>`;
      },

      renderQuizCard: function (card) {
        const primaryClass = card.classStats.length
          ? card.classStats.map(c => `${this.escapeHtml(c.className)} ${c.average}%`).join(' · ')
          : 'Aucune classe';
        return `
      <article class="flex flex-col gap-3 min-h-[168px] p-4 border border-zinc-200 dark:border-white/10 rounded-2xl bg-zinc-50 dark:bg-[#1C1C1C] cursor-pointer shadow-sm hover:border-secondary dark:hover:border-secondary transition-all group" onclick="ReportsDashboard.openQuizDashboard('${this.escapeJsString(String(card.quiz.id || ''))}', '${this.escapeJsString(card.code)}')">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h2 class="text-lg font-black text-zinc-900 dark:text-white leading-tight group-hover:text-secondary transition-colors">${this.escapeHtml(card.title)}</h2>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-2 font-medium">Code ${this.escapeHtml(card.code)}</p>
          </div>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-white/5 rounded-full text-[10px] font-bold text-zinc-500 dark:text-zinc-400 shrink-0"><i data-lucide="calendar-days" size="12"></i>${this.escapeHtml(card.date)}</span>
        </div>
        <div class="flex items-center justify-between gap-3 pt-3 border-t border-zinc-200/50 dark:border-white/5 mt-auto">
          <span class="text-xs text-zinc-500 font-medium">Classe</span>
          <strong class="text-sm font-bold text-zinc-900 dark:text-white">${primaryClass}</strong>
        </div>
        <div class="flex items-center justify-between gap-3 pt-2">
          <span class="text-xs text-zinc-500 font-medium">Moyenne</span>
          ${card.count ? this.renderScore(card.average) : '<span class="text-xs text-zinc-400">-</span>'}
        </div>
        <div class="flex items-center justify-between gap-3 pt-2">
          <span class="text-xs text-zinc-500 font-medium">Copies</span>
          <strong class="text-sm font-bold text-zinc-900 dark:text-white">${card.count}</strong>
        </div>
        <div class="text-[11px] text-zinc-400 mt-1 font-medium">${card.latestDate ? `Dernière copie : ${this.escapeHtml(card.latestDate)}` : 'Aucune copie rendue'}</div>
      </article>`;
      },

      renderQuizPage: function () {
        const reports = this.getCurrentReports();
        const students = this.getFilteredStudents(reports);
        const selected = this.getSelectedStudent(students);
        const quiz = this.currentQuiz || this.getQuizByCode(this.currentQuizCode) || { title: 'Quiz', shareCode: this.currentQuizCode, questions: [] };
        const stats = this.getQuizStats(reports);
        const classes = this.getClasses(reports);
        const classStats = classes.map(className => {
          const rows = reports.filter(r => r.className === className);
          return { className, count: rows.length, average: this.average(rows, r => r.score), attention: rows.filter(r => r.score < 50).length };
        });
        const questionStats = this.getQuestionStats(reports, quiz);
        const page = this.activeQuizPage || 'overview';
        return `
      <div class="w-full h-full fade-in flex gap-6 mob-full-col mob-auto-h">
        <div class="flex-1 flex flex-col gap-4 overflow-hidden">
          <div class="flex items-center justify-between gap-3 bg-white dark:bg-[#131313] border border-zinc-100 dark:border-white/10 rounded-2xl p-4 shadow-sm shrink-0 flex-wrap">
            <div class="flex items-center gap-4">
              <button class="flex items-center justify-center w-10 h-10 rounded-xl bg-zinc-50 dark:bg-white/5 text-zinc-500 hover:bg-zinc-100 dark:hover:bg-white/10 transition-colors" type="button" onclick="ReportsDashboard.closeDashboard()" title="Retour aux quiz"><i data-lucide="arrow-left" size="18"></i></button>
              <div class="flex flex-col gap-0.5">
                <p class="text-[10px] font-black uppercase tracking-widest text-zinc-400">Code ${this.escapeHtml(String(quiz.shareCode || this.currentQuizCode || ''))}</p>
                <h1 class="text-lg md:text-xl font-black font-display text-zinc-900 dark:text-white m-0 leading-tight">${this.escapeHtml(quiz.title || 'Quiz sans titre')}</h1>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-secondary text-white text-xs font-bold transition-transform hover:scale-105 active:scale-95" type="button" onclick="state.activeQuizId='${this.escapeJsString(String(quiz.id || ''))}';state.activeTab='Share';render();"><i data-lucide="share-2" size="14"></i>Partager</button>
            </div>
          </div>
          ${this.renderQuizNav(page)}
          <div id="reports-table-container" class="flex-1 bg-white dark:bg-[#131313] border border-zinc-100 dark:border-white/10 rounded-2xl overflow-y-auto shadow-sm relative p-4 md:p-6">
            ${page === 'overview' ? this.renderOverviewPage(stats, classStats, reports) : ''}
            ${page === 'students' ? this.renderStudentsPage(students, selected, quiz, questionStats, reports, classes) : ''}
            ${page === 'classes' ? this.renderClassesPage(classStats) : ''}
            ${page === 'questions' ? this.renderQuestionsPage(questionStats, reports, quiz) : ''}
            ${page === 'ai' ? this.renderAIFullPage(questionStats, reports, quiz) : ''}
            ${page === 'exports' ? this.renderExportsPage(students) : ''}
          </div>
        </div>
      </div>`;
      },

      renderQuizNav: function (active) {
        const tabs = [
          ['overview', 'layout-dashboard', 'Vue d’ensemble'],
          ['students', 'users', 'Élèves'],
          ['classes', 'school', 'Classes'],
          ['questions', 'list-checks', 'Questions'],
          ['ai', 'message-square', 'Kwizy IA'],
          ['exports', 'download', 'Exports']
        ];
        return `
      <div class="flex items-center gap-2 overflow-x-auto scrollbar-hide pb-1 shrink-0">
        ${tabs.map(([id, icon, label]) => `
          <button type="button" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition-colors ${active === id ? 'bg-secondary/10 text-secondary border border-secondary/20' : 'bg-white dark:bg-[#131313] text-zinc-500 border border-zinc-100 dark:border-white/10 hover:bg-zinc-50 dark:hover:bg-white/5'}" onclick="ReportsDashboard.setQuizPage('${id}')">
            <i data-lucide="${icon}" size="16"></i>${label}
          </button>
        `).join('')}
      </div>`;
      },

      renderOverviewPage: function (stats, classStats, reports) {
        return `
      <div class="rpt-stats-row">
        ${this.renderBigStat('Copies', stats.copies, 'Élèves ayant rendu')}
        ${this.renderBigStat('Moyenne', `${stats.average}%`, stats.copies ? `${stats.totalPoints} / ${stats.totalMax} points` : 'Aucune copie')}
        ${this.renderBigStat('Classes', stats.classes, 'Groupes concernés')}
        ${this.renderBigStat('À revoir', stats.attention, 'Scores sous 50%')}
      </div>
      <div class="rpt-panel" style="padding:16px;margin-top:14px">
        <p class="rpt-mini-label">Aperçu rapide</p>
        ${reports.length ? `
          <div class="rpt-class-list">
            ${classStats.map(c => `<span class="rpt-chip">${this.escapeHtml(c.className)} ${this.renderScore(c.average)} <span class="rpt-muted">${c.count} copie${c.count > 1 ? 's' : ''}</span></span>`).join('')}
          </div>
        ` : '<p class="rpt-muted">Aucune copie rendue pour ce quiz.</p>'}
      </div>`;
      },

      renderStudentsPage: function (students, selected, quiz, questionStats, reports, classes) {
        return `
      <div class="rpt-panel">
        <div class="rpt-toolbar">
          <div class="rpt-search">
            <div class="rpt-search-icon"><i data-lucide="search" size="18"></i></div>
            <input class="rpt-field" type="search" placeholder="Rechercher un élève..." value="${this.escapeHtml(this.quizFilters.query)}" oninput="ReportsDashboard.setQuizQuery(this.value)">
          </div>
          <div class="rpt-dd" id="rpt-dd-class">
            <button class="rpt-dd-btn" onclick="ReportsDashboard.toggleDropdown('rpt-dd-class',event)">
              <span>${this.quizFilters.className === 'all' ? 'Toutes les classes' : this.escapeHtml(this.quizFilters.className)}</span>
              <i class="fas fa-chevron-down rpt-dd-arrow"></i>
            </button>
            <div class="rpt-dd-menu" style="display:none">
              <div class="rpt-dd-item${this.quizFilters.className === 'all' ? ' is-active' : ''}" onclick="ReportsDashboard.setQuizClass('all')">Toutes les classes</div>
              ${classes.map(c => `<div class="rpt-dd-item${this.quizFilters.className === c ? ' is-active' : ''}" onclick="ReportsDashboard.setQuizClass(${JSON.stringify(c)})">${this.escapeHtml(c)}</div>`).join('')}
            </div>
          </div>
          <div class="rpt-dd" id="rpt-dd-sort">
            <button class="rpt-dd-btn" onclick="ReportsDashboard.toggleDropdown('rpt-dd-sort',event)">
              <span>${{ 'recent': 'Plus récent', 'name': 'Nom A-Z', 'class': 'Classe', 'scoreDesc': 'Meilleurs scores', 'scoreAsc': 'Scores à revoir' }[this.quizFilters.sort] || 'Plus récent'}</span>
              <i class="fas fa-chevron-down rpt-dd-arrow"></i>
            </button>
            <div class="rpt-dd-menu" style="display:none">
              ${[['recent', 'Plus récent'], ['name', 'Nom A-Z'], ['class', 'Classe'], ['scoreDesc', 'Meilleurs scores'], ['scoreAsc', 'Scores à revoir']].map(([v, l]) => `<div class="rpt-dd-item${this.quizFilters.sort === v ? ' is-active' : ''}" onclick="ReportsDashboard.setQuizSort('${v}')">${l}</div>`).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="rpt-workspace" style="margin-top:14px">
        <div class="rpt-panel">
          ${students.length ? `
            <div class="rpt-student-list">
              ${students.map(r => this.renderStudentRow(r, selected)).join('')}
            </div>
          ` : this.renderEmpty('Aucun élève trouvé', reports.length ? 'Modifiez la recherche ou les filtres.' : 'Les copies apparaîtront ici quand les élèves auront rendu le quiz.')}
        </div>
        <div class="rpt-panel">
          ${selected ? this.renderStudentDetail(selected, quiz, students, questionStats) : this.renderEmpty('Sélectionnez un élève', 'La fiche individuelle apparaîtra ici.')}
        </div>
      </div>`;
      },

      renderClassesPage: function (classStats) {
        if (!classStats.length) return this.renderEmpty('Aucune classe', 'Les classes apparaîtront quand les élèves auront rendu le quiz.');
        return `<div class="rpt-panel">${this.renderClassTable(classStats)}</div>`;
      },

      renderQuestionsPage: function (questionStats, reports, quiz) {
        return `
      <div class="rpt-panel" style="padding:16px">
        <p class="rpt-mini-label">Analyse des questions</p>
        <div class="rpt-question-list" style="margin-top:12px">
          ${questionStats.length ? questionStats.map(q => `
            <div class="rpt-question">
              <div class="rpt-question-top">
                <p class="rpt-question-title">Q${q.index + 1}. ${this.escapeHtml(q.text)}</p>
                ${this.renderScore(q.successRate)}
              </div>
              <div class="rpt-muted">${q.correct} bonne${q.correct > 1 ? 's' : ''} réponse${q.correct > 1 ? 's' : ''} sur ${q.answered} copie${q.answered > 1 ? 's' : ''}</div>
            </div>
          `).join('') : '<p class="rpt-muted">Les détails des réponses ne sont pas encore disponibles pour ce quiz.</p>'}
        </div>
      </div>`;
      },

      renderAIFullPage: function (questionStats, reports, quiz) {
        try {
          const ctx = this.buildAIContext(questionStats, reports, quiz);
          window._kwizyAIContext = ctx;
          return `
        <div class="rpt-panel" style="padding:0;margin-top:14px">
          <iframe id="mistral-iframe-full" src="mistral_ai_widget.html"
            style="width:100%;height:calc(100vh - 220px);border:none;border-radius:12px;min-height:560px;"
            onload="(function(iframe){var ctx=window._kwizyAIContext;if(!ctx)return;try{iframe.contentWindow.postMessage({type:'mistral-context',context:ctx},'*')}catch(e){}setTimeout(function(){try{iframe.contentWindow.postMessage({type:'mistral-context',context:ctx},'*')}catch(e){}},600)})(this)">
          </iframe>
        </div>`;
        } catch (e) {
          return `<div class="rpt-panel" style="padding:16px"><p class="rpt-muted">Impossible de préparer le contexte IA.</p></div>`;
        }
      },

      buildAIContext: function (questionStats, reports, quiz) {
        const questions = (Array.isArray(quiz.questions) ? quiz.questions : []).map((q, index) => ({
          index: index + 1, type: q.type || 'QUESTION', text: q.text || '',
          options: q.options || [], correctOptionIndex: q.correctOptionIndex,
          correctOptionIndexes: q.correctOptionIndexes || [],
          expectedAnswer: q.expectedAnswer || q.expectedAns || '',
          stats: questionStats.find(s => s.index === index) || null
        }));
        const students = reports.map(r => ({
          name: r.student, className: r.className, score: r.score, points: r.points, total: r.total,
          submittedAt: r.date || r.rawDate,
          answers: (r.answers || []).map((answer, index) => ({ question: index + 1, value: answer.value, correct: answer.correct }))
        }));
        const context = {
          quiz: { title: quiz.title || 'Quiz sans titre', code: quiz.shareCode || this.currentQuizCode || '', questionCount: questions.length },
          summary: this.getQuizStats(reports), questions, students
        };
        const serialized = JSON.stringify(context);
        return serialized.length > 24000 ? serialized.slice(0, 24000) + '\n[Contexte tronqué]' : serialized;
      },

      renderExportsPage: function (students) {
        return `
      <div class="rpt-panel" style="padding:18px">
        <p class="rpt-mini-label">Exporter les données du quiz</p>
        <div class="rpt-actions" style="margin-top:12px">
          <button class="rpt-btn rpt-btn-primary" type="button" onclick="ReportsDashboard.downloadCSV()"><i data-lucide="table" size="16"></i>Télécharger CSV</button>
          <button class="rpt-btn" type="button" onclick="ReportsDashboard.downloadPDF()"><i data-lucide="download" size="16"></i>Télécharger PDF</button>
        </div>
      </div>
      <div class="rpt-panel" style="margin-top:14px">
        ${students.length ? this.renderSummaryTable(students) : this.renderEmpty('Aucune copie', 'Il n’y a rien à exporter pour ce quiz.')}
      </div>`;
      },

      renderBigStat: function (label, value, note) {
        return `
      <div class="rpt-big-stat">
        <p class="rpt-mini-label">${this.escapeHtml(label)}</p>
        <div>
          <p class="rpt-big-value">${this.escapeHtml(value)}</p>
          <p class="rpt-muted" style="margin:8px 0 0">${this.escapeHtml(note)}</p>
        </div>
      </div>`;
      },

      renderStudentRow: function (r, selected) {
        const active = selected && String(selected.studentId) === String(r.studentId);
        return `
      <div class="rpt-student-row ${active ? 'active' : ''}" onclick="ReportsDashboard.selectStudent('${this.escapeJsString(r.studentId)}')">
        <span class="rpt-avatar">${this.escapeHtml((r.student.charAt(0) || 'E').toUpperCase())}</span>
        <div style="min-width:0">
          <div class="rpt-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${this.escapeHtml(r.student)}</div>
          <div class="rpt-muted">${this.escapeHtml(r.className)} · ${this.escapeHtml(r.date || '-')}</div>
        </div>
        ${this.renderScore(r.score)}
      </div>`;
      },

      renderStudentDetail: function (student, quiz, students, questionStats) {
        const index = students.findIndex(r => String(r.studentId) === String(student.studentId));
        const previous = index > 0 ? students[index - 1] : null;
        const next = index >= 0 && index < students.length - 1 ? students[index + 1] : null;
        const answers = Array.isArray(student.answers) ? student.answers : [];
        return `
      <div class="rpt-detail">
        <div class="rpt-detail-head">
          <div>
            <p class="rpt-kicker">Fiche élève</p>
            <h2 class="rpt-detail-title">${this.escapeHtml(student.student)}</h2>
            <p class="rpt-muted">${this.escapeHtml(student.className)} · rendu le ${this.escapeHtml(student.date || '-')}</p>
          </div>
          <div class="rpt-actions">
            <button class="rpt-btn" type="button" ${previous ? `onclick="ReportsDashboard.selectStudent('${this.escapeJsString(previous.studentId)}')"` : 'disabled'}><i data-lucide="chevron-left" size="16"></i>Précédent</button>
            <button class="rpt-btn" type="button" ${next ? `onclick="ReportsDashboard.selectStudent('${this.escapeJsString(next.studentId)}')"` : 'disabled'}>Suivant<i data-lucide="chevron-right" size="16"></i></button>
          </div>
        </div>
        <div class="rpt-detail-grid">
          ${this.renderBigStat('Score', `${student.score}%`, `${student.points} / ${student.total} points`)}
          ${this.renderBigStat('Classe', student.className, 'Groupe élève')}
          ${this.renderBigStat('Rang affiché', `${index + 1} / ${students.length}`, 'Selon le tri actuel')}
        </div>
        <div>
          <div class="rpt-progress"><div class="rpt-progress-fill" style="width:${student.score}%"></div></div>
        </div>
        <div class="rpt-actions">
          <button class="rpt-btn rpt-btn-primary" type="button" onclick="ReportsDashboard.openCopy('${this.escapeJsString(student.quizCode)}','${this.escapeJsString(student.studentId)}')"><i data-lucide="file-search" size="16"></i>Ouvrir la copie complète</button>
          <button class="rpt-btn rpt-btn-danger" type="button" onclick="actions.deleteReport('${this.escapeJsString(student.quizCode)}','${this.escapeJsString(student.studentId)}')"><i data-lucide="trash-2" size="16"></i>Supprimer</button>
        </div>
        <div>
          <p class="rpt-mini-label">Réponses de l'élève</p>
          <div class="rpt-question-list">
            ${answers.length ? answers.map((answer, i) => this.renderAnswerRow(answer, i, quiz)).join('') : this.renderQuestionStatsFallback(questionStats)}
          </div>
        </div>
      </div>`;
      },

      renderAnswerRow: function (answer, index, quiz) {
        const question = Array.isArray(quiz.questions) ? quiz.questions[index] : null;
        const correct = answer.correct === true;
        const wrong = answer.correct === false;
        const status = correct ? 'Correct' : wrong ? 'À revoir' : 'Non corrigé';
        const score = correct ? 100 : wrong ? 0 : 50;
        return `
      <div class="rpt-question">
        <div class="rpt-question-top">
          <p class="rpt-question-title">Q${index + 1}. ${this.escapeHtml(question?.text || `Question ${index + 1}`)}</p>
          ${this.renderScore(score)}
        </div>
        <div class="rpt-muted">
          ${this.escapeHtml(status)}${answer.value !== undefined && answer.value !== null ? ` · Réponse : ${this.escapeHtml(Array.isArray(answer.value) ? answer.value.join(', ') : answer.value)}` : ''}
        </div>
      </div>`;
      },

      renderQuestionStatsFallback: function (questionStats) {
        if (!questionStats.length) {
          return '<div class="rpt-muted">Les réponses détaillées ne sont pas encore disponibles ici. Utilisez "Ouvrir la copie complète" pour charger la copie.</div>';
        }
        return questionStats.map(q => `
      <div class="rpt-question">
        <div class="rpt-question-top">
          <p class="rpt-question-title">Q${q.index + 1}. ${this.escapeHtml(q.text)}</p>
          ${this.renderScore(q.successRate)}
        </div>
        <div class="rpt-muted">${q.correct} bonne${q.correct > 1 ? 's' : ''} réponse${q.correct > 1 ? 's' : ''} sur ${q.answered} copie${q.answered > 1 ? 's' : ''}</div>
      </div>
    `).join('');
      },

      renderClassTable: function (classStats) {
        return `
      <div class="rpt-table-wrap">
        <table class="rpt-table">
          <thead><tr><th>Classe</th><th>Moyenne</th><th>Copies</th><th>À revoir</th></tr></thead>
          <tbody>
            ${classStats.map(c => `
              <tr>
                <td><strong>${this.escapeHtml(c.className)}</strong></td>
                <td>${this.renderScore(c.average)}</td>
                <td>${this.escapeHtml(c.count)}</td>
                <td>${this.escapeHtml(c.attention || 0)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
      },

      renderSummaryTable: function (students) {
        return `
      <div class="rpt-table-wrap">
        <table class="rpt-table">
          <thead><tr><th>Élève</th><th>Classe</th><th>Score</th><th>Points</th><th>Date</th></tr></thead>
          <tbody>
            ${students.map(r => `
              <tr onclick="ReportsDashboard.selectStudent('${this.escapeJsString(r.studentId)}')" style="cursor:pointer">
                <td><strong>${this.escapeHtml(r.student)}</strong></td>
                <td>${this.escapeHtml(r.className)}</td>
                <td>${this.renderScore(r.score)}</td>
                <td>${this.escapeHtml(r.points)} / ${this.escapeHtml(r.total)}</td>
                <td>${this.escapeHtml(r.date || '-')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
      },

      renderEmpty: function (title, text) {
        return `
      <div class="rpt-empty">
        <i data-lucide="inbox" size="38"></i>
        <h3>${this.escapeHtml(title)}</h3>
        <p>${this.escapeHtml(text)}</p>
      </div>`;
      },

      toggleDropdown: function (id, event) {
        if (event) event.stopPropagation();
        const dd = document.getElementById(id);
        if (!dd) return;
        const menu = dd.querySelector('.rpt-dd-menu');
        const btn = dd.querySelector('.rpt-dd-btn');
        if (!menu) return;
        const isOpen = menu.style.display !== 'none';
        document.querySelectorAll('.rpt-dd-menu').forEach(m => {
          if (m !== menu && m.style.display !== 'none') {
            const parentId = m.closest('.rpt-dd')?.id;
            if (parentId) ReportsDashboard.closeDropdown(parentId);
          }
        });
        if (isOpen) {
          this.closeDropdown(id);
        } else {
          menu.style.display = 'block';
          menu.classList.remove('is-closing');
          btn.classList.add('is-open');
          const close = (e) => {
            if (!dd.contains(e.target)) {
              ReportsDashboard.closeDropdown(id);
              document.removeEventListener('click', close);
            }
          };
          setTimeout(() => document.addEventListener('click', close), 0);
        }
      },
      closeDropdown: function (id) {
        const dd = id ? document.getElementById(id) : null;
        if (!dd) return;
        const menu = dd.querySelector('.rpt-dd-menu');
        const btn = dd.querySelector('.rpt-dd-btn');
        if (menu && menu.style.display !== 'none') {
          menu.classList.add('is-closing');
          setTimeout(() => { if (menu) { menu.style.display = 'none'; menu.classList.remove('is-closing'); } }, 130);
        }
        if (btn) btn.classList.remove('is-open');
      },
      setHomeQuery: function (value) { this.homeQuery = value; window.render(); },
      setQuizQuery: function (value) { this.quizFilters.query = value; window.render(); },
      setQuizClass: function (value) { this.quizFilters.className = value; this.selectedStudentId = null; window.render(); },
      setQuizSort: function (value) { this.quizFilters.sort = value; window.render(); },
      setQuizPage: function (page) { this.activeQuizPage = page; window.render(); },
      selectStudent: function (studentId) { this.selectedStudentId = studentId; window.render(); },

      openCopy: function (quizCode, studentId) {
        if (window.actions && typeof window.actions.viewStudentCopy === 'function') {
          window.actions.viewStudentCopy(quizCode, studentId);
        }
      },

      openQuizDashboard: async function (quizId, shareCode) {
        const allQuizzes = this.getQuizzes();
        this.currentQuiz = allQuizzes.find(q =>
          String(q.id || '') === String(quizId || '') ||
          String(q.shareCode || '') === String(shareCode || '')
        ) || this.getQuizByCode(shareCode);
        this.currentQuizCode = String(shareCode || this.currentQuiz?.shareCode || '');
        this.currentResults = [];
        this.selectedStudentId = null;
        this.activeQuizPage = 'overview';
        this.quizFilters = { query: '', className: 'all', sort: 'recent' };
        const container = document.getElementById('main-content-container');
        if (container) {
          container.innerHTML = `<div class="rpt-page"><div class="rpt-shell">${this.renderEmpty('Chargement du quiz', 'Récupération des copies et des réponses...')}</div></div>`;
          if (window.lucide) window.lucide.createIcons();
        }
        if (this.currentQuizCode && window.actions && typeof window.actions.apiFetch === 'function') {
          try {
            const response = await window.actions.apiFetch(`../../api/v1/results.php?code=${encodeURIComponent(this.currentQuizCode)}`);
            if (response && response.ok) {
              const data = await response.json();
              this.currentResults = Array.isArray(data) ? data : [];
            }
          } catch (error) {
            console.error('Erreur rapports:', error);
            this.currentResults = [];
          }
        }
        window.render();
      },

      closeDashboard: function () {
        this.currentQuizCode = null; this.currentQuiz = null; this.currentResults = [];
        this.selectedStudentId = null; this.activeQuizPage = 'overview';
        window.render();
      },

      getExportRows: function () {
        return this.currentQuizCode ? this.getFilteredStudents(this.getCurrentReports()) : this.getReports();
      },

      downloadCSV: function () {
        const rows = this.getExportRows();
        if (!rows.length) { if (window.actions) window.actions.showNotification('Aucun rapport à exporter.', 'info'); return; }
        const escapeCsv = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
        const lines = [
          ['Nom', 'Classe', 'Quiz', 'Code', 'Score', 'Total', 'Pourcentage', 'Date'].map(escapeCsv).join(','),
          ...rows.map(r => [r.student, r.className, r.quiz, r.quizCode, r.points, r.total, `${r.score}%`, r.date || this.formatDateTime(r.rawDate)].map(escapeCsv).join(','))
        ];
        const blob = new Blob([`﻿${lines.join('\n')}`], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `Kwizy_Rapports_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        URL.revokeObjectURL(url);
      },

      downloadPDF: function () {
        const element = document.getElementById('reports-table-container');
        if (!element) return;
        if (typeof window.html2pdf === 'function') {
          window.html2pdf().set({ margin: 10, filename: `Kwizy_Rapports_${new Date().toISOString().slice(0, 10)}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(element).save();
          return;
        }
        window.print();
      }
    };

    window.ReportsDashboard = ReportsDashboard;
    window.Reports = ReportsDashboard;
  </script>

</body>

</html>
